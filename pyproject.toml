[project]
name = "irdecks"
version = "0.1.0"
description = "Find and download a company's latest corporate presentation from its investor-relations site"
authors = [
    { name = "MikeMavrok", email = "michail.mavrokoukoulakis@student.uva.nl" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.11.0",
    "beautifulsoup4>=4.15.0",
    "curl-cffi>=0.16.3",
    "jinja2>=3.1.6",
    "lxml>=6.1.3",
    "protego>=0.7.0",
    "pydantic>=2.13.5",
    "pypdf>=6.19.0",
    "rapidfuzz>=3.14.6",
    "rich>=15.0.0",
    "typer>=0.27.2",
]

[project.scripts]
irdecks = "irdecks.cli:app"

[project.optional-dependencies]
llm = []
browser = [
    "playwright>=1.63.0",
]
web = [
    "streamlit>=1.65.0",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits the real websites (run with --live)"]
